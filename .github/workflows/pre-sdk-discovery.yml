name: Temporary pre-SDK discovery probe
on:
  push:
    branches:
      - discovery/pre-sdk-20261102
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Checkout exact experimental commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Inventory installed build tools and host
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "DISCOVERY: sha=$(git rev-parse HEAD)"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption,Version,BuildNumber,OSArchitecture | Format-List
          Write-Host "DISCOVERY: dotnet SDKs"; dotnet --list-sdks
          Write-Host "DISCOVERY: dotnet runtimes"; dotnet --list-runtimes
          Write-Host "DISCOVERY: dotnet SDK version"; dotnet --version
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          Write-Host "DISCOVERY: vswhere path=$vswhere"
          & $vswhere -latest -property installationPath
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild unavailable' }
          Write-Host "DISCOVERY: msbuild=$msbuild"
          & $msbuild -version -nologo
          $csc = Join-Path (Split-Path -Parent $msbuild) 'Roslyn\csc.exe'
          Write-Host "DISCOVERY: csc=$csc present=$(Test-Path $csc)"
          if (Test-Path $csc) { & $csc /version }
          Write-Host "DISCOVERY: nuget=$((Get-Command nuget).Source)"
          nuget help | Select-Object -First 6
          Write-Host "DISCOVERY: net48 reference assemblies=$(Test-Path 'C:\Program Files (x86)\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8\mscorlib.dll')"
          Write-Host "DISCOVERY: docker cli=$([bool](Get-Command docker -ErrorAction SilentlyContinue))"
          docker version --format 'Client={{.Client.Version}} Server={{.Server.Version}}'
          Write-Host "DISCOVERY: docker exit=$LASTEXITCODE"
          Get-ChildItem Env: | Where-Object { $_.Name -match '^(DOTNET|MSBUILD|VSINSTALLDIR|VisualStudioVersion|NUGET|RUNNER_OS|ImageOS|ImageVersion)' } | Sort-Object Name | Format-Table -AutoSize
      - name: Restore and build pre-change baseline
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force TestResults | Out-Null
          nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Baseline restore failed' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\verify_public_api.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Baseline API gate failed' }
          & .\scripts\verify_xml_documentation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Baseline XML gate failed' }
          & .\scripts\build_release_candidate.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'presdk-baseline')
          if ($LASTEXITCODE -ne 0) { throw 'Baseline packaging failed' }
      - name: Run all five baseline NUnit assemblies
        shell: pwsh
        run: |
          $runner = '.\packages\NUnit.ConsoleRunner.3.17.0\tools\nunit3-console.exe'
          $assemblies = @('Domain','Application','Infrastructure.Csv','Infrastructure.Reporting','Infrastructure.Xlsx') | ForEach-Object { "tests\RecordSift.$_.Tests\bin\Release\RecordSift.$_.Tests.dll" }
          & $runner @assemblies '--result=TestResults/presdk-before.xml;format=nunit3' --noheader
          if ($LASTEXITCODE -ne 0) { throw 'Baseline NUnit suite failed' }
          [xml]$xml = Get-Content 'TestResults/presdk-before.xml'
          Write-Host "DISCOVERY before: total=$($xml.'test-run'.total) passed=$($xml.'test-run'.passed) failed=$($xml.'test-run'.failed) skipped=$($xml.'test-run'.skipped)"
          if ([int]$xml.'test-run'.failed -ne 0 -or [int]$xml.'test-run'.total -lt 419) { throw 'Baseline NUnit regression' }
      - name: Probe original MSBuild imports and dotnet msbuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $domain = 'src\RecordSift.Domain\RecordSift.Domain.csproj'
          & $msbuild $domain '/pp:TestResults/original.pp.xml' /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Original MSBuild preprocessing failed' }
          Write-Host 'DISCOVERY original import markers:'
          Select-String -Path 'TestResults/original.pp.xml' -SimpleMatch 'Directory.Build.props','Directory.Build.targets','Microsoft.Common.props','Microsoft.Common.targets' | Select-Object -First 12 | ForEach-Object { Write-Host $_.Line.Trim() }
          Write-Host 'DISCOVERY original LangVersion:'; & $msbuild $domain '-getProperty:LangVersion' /p:Configuration=Release
          Write-Host 'DISCOVERY original props custom marker:'; & $msbuild $domain '-getProperty:PreSdkProbe' /p:Configuration=Release
          $ErrorActionPreference = 'Continue'
          dotnet msbuild $domain /t:Rebuild /p:Configuration=Release /p:OutputPath=bin\DotnetProbe\ /verbosity:minimal *> 'TestResults/dotnet-msbuild-original.log'
          $status = $LASTEXITCODE
          Write-Host "DISCOVERY original dotnet-msbuild exit=$status"
          Get-Content 'TestResults/dotnet-msbuild-original.log' | Select-Object -Last 30
          $ErrorActionPreference = 'Stop'
      - name: Probe Directory.Build.props and Directory.Build.targets before early import
        shell: pwsh
        run: |
          @'
          <Project>
            <PropertyGroup>
              <PreSdkProbe>imported</PreSdkProbe>
              <LangVersion>7.3</LangVersion>
            </PropertyGroup>
          </Project>
          '@ | Set-Content -Path Directory.Build.props -Encoding utf8
          @'
          <Project>
            <Target Name="PreSdkTarget">
              <Message Importance="high" Text="DISCOVERY late targets were imported for $(MSBuildProjectName)" />
            </Target>
          </Project>
          '@ | Set-Content -Path Directory.Build.targets -Encoding utf8
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $domain = 'src\RecordSift.Domain\RecordSift.Domain.csproj'
          Write-Host 'DISCOVERY props marker before Common.props import:'
          & $msbuild $domain '-getProperty:PreSdkProbe'
          Write-Host 'DISCOVERY explicit late target:'
          & $msbuild $domain /t:PreSdkTarget /verbosity:normal
          if ($LASTEXITCODE -ne 0) { throw 'Late Directory.Build.targets import failed' }
      - name: Experiment centralizing LangVersion without changing legacy import order
        shell: pwsh
        run: |
          $csprojs = @(Get-ChildItem src,tests -Recurse -Filter '*.csproj')
          if ($csprojs.Count -ne 10) { throw "Expected ten project files; found $($csprojs.Count)" }
          foreach ($proj in $csprojs) {
            $source = Get-Content $proj.FullName -Raw
            if ($source -notmatch '<LangVersion>7.3</LangVersion>') { throw "Missing expected LangVersion in $($proj.Name)" }
            $source = $source.Replace('<LangVersion>7.3</LangVersion>', '')
            Set-Content $proj.FullName -Value $source -Encoding utf8
          }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $domain = 'src\RecordSift.Domain\RecordSift.Domain.csproj'
          & $msbuild $domain '/pp:TestResults/centralized.pp.xml' /p:Configuration=Release
          if ($LASTEXITCODE -ne 0) { throw 'Modified preprocess failed' }
          Write-Host 'DISCOVERY centralized props marker:'; & $msbuild $domain '-getProperty:PreSdkProbe'
          Write-Host 'DISCOVERY centralized LangVersion:'; & $msbuild $domain '-getProperty:LangVersion'
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Post-change build failed' }
          & powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File .\scripts\verify_public_api.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Post-change API gate failed' }
          & .\scripts\verify_xml_documentation.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Post-change XML gate failed' }
          & .\scripts\build_release_candidate.ps1 -OutputDirectory (Join-Path $env:RUNNER_TEMP 'presdk-after')
          if ($LASTEXITCODE -ne 0) { throw 'Post-change packaging failed' }
          Write-Host 'DISCOVERY temporary-only changes:'; git status --short
      - name: Run all five post-change NUnit assemblies
        shell: pwsh
        run: |
          $runner = '.\packages\NUnit.ConsoleRunner.3.17.0\tools\nunit3-console.exe'
          $assemblies = @('Domain','Application','Infrastructure.Csv','Infrastructure.Reporting','Infrastructure.Xlsx') | ForEach-Object { "tests\RecordSift.$_.Tests\bin\Release\RecordSift.$_.Tests.dll" }
          & $runner @assemblies '--result=TestResults/presdk-after.xml;format=nunit3' --noheader
          if ($LASTEXITCODE -ne 0) { throw 'Post-change NUnit suite failed' }
          [xml]$a = Get-Content 'TestResults/presdk-after.xml'
          [xml]$b = Get-Content 'TestResults/presdk-before.xml'
          Write-Host "DISCOVERY after: total=$($a.'test-run'.total) passed=$($a.'test-run'.passed) failed=$($a.'test-run'.failed) skipped=$($a.'test-run'.skipped)"
          foreach($attr in @('total','passed','failed','skipped')) {
            if ($a.'test-run'.GetAttribute($attr) -ne $b.'test-run'.GetAttribute($attr)) { throw "Counts changed for $attr" }
          }
      - name: Upload experimental evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pre-sdk-discovery-${{ github.run_id }}
          path: TestResults/
          if-no-files-found: warn
