name: Extended Windows adversarial resource validation
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Repeat bounded NFR-007 CSV/XLSX suite in separate processes (1-10)'
        type: number
        required: true
        default: 3
      max_private_megabytes:
        description: 'Sampled private memory ceiling per NUnit process (256-2048 MiB)'
        type: number
        required: true
        default: 768

permissions:
  contents: read

concurrency:
  group: extended-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bounded-adversarial-stress:
    name: Isolated Windows net48 adversarial resource sampling
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Restore pinned dependencies
        shell: pwsh
        run: |
          nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }
      - name: Build net48 tests
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found.' }
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Build failed: $LASTEXITCODE" }
      - name: Repeat bounded adversarial tests with sampled memory and process timeouts
        shell: pwsh
        env:
          SECURITY_ITERATIONS: ${{ inputs.iterations }}
          SECURITY_MAX_PRIVATE_MIB: ${{ inputs.max_private_megabytes }}
        run: |
          & .\scripts\run_adversarial_stress.ps1 -Iterations ([int]$env:SECURITY_ITERATIONS) -MaximumPrivateMegabytes ([int]$env:SECURITY_MAX_PRIVATE_MIB) -PerProcessTimeoutSeconds 90
      - name: Preserve synthetic NUnit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: extended-nunit-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/extended-*.xml
          if-no-files-found: ignore
          retention-days: 7
