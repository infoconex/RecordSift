name: Verify internal release candidate in clean Windows consumer
on:
  pull_request:
    branches:
      - main
      - 'release/**'
  push:
    branches:
      - main
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-consumer:
    name: Standalone NuGet net48 consumer
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Restore packages.config dependencies
        shell: pwsh
        run: |
          nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
      - name: Release MSBuild for package inputs
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild missing.' }
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'MSBuild failed.' }
      - name: Build unpublished package and run installed consumer
        shell: pwsh
        run: |
          $feed = Join-Path $env:RUNNER_TEMP 'RecordSift-Internal-RC'
          & .\scripts\build_release_candidate.ps1 -OutputDirectory $feed
          & .\scripts\verify_clean_consumer.ps1 -CandidateDirectory $feed
      - name: Validate unpublished stable 0.1.0 package in independent net48 consumer
        shell: pwsh
        run: |
          # Internal-only local staging: do not upload, tag, create a release, or push to any feed.
          $feed = Join-Path $env:RUNNER_TEMP 'RecordSift-Internal-Stable'
          & .\scripts\build_release_candidate.ps1 -OutputDirectory $feed -PackageVersion '0.1.0'
          & .\scripts\verify_clean_consumer.ps1 -CandidateDirectory $feed -PackageVersion '0.1.0'

