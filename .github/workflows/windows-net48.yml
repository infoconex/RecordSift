name: Windows .NET Framework 4.8 build and test
on:
  pull_request:
    branches:
      - 'release/**'
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: net48-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Windows restore, MSBuild and NUnit
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Restore packages.config dependencies
        shell: pwsh
        run: |
          nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw "NuGet restore failed: $LASTEXITCODE" }
      - name: Build both legacy projects with Visual Studio MSBuild
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found." }
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild failed: $LASTEXITCODE" }
      - name: Run independent core unit and real-adapter contract NUnit suites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $runner = 'packages\NUnit.ConsoleRunner.3.17.0\tools\nunit3-console.exe'
          if (-not (Test-Path $runner)) { throw "NUnit runner is missing: $runner" }
          $coreAssembly = 'tests\RecordSift.Tests\bin\Release\RecordSift.Tests.dll'
          $adapterAssembly = 'tests\RecordSift.CsvHelperAdapter.Tests\bin\Release\RecordSift.CsvHelperAdapter.Tests.dll'
          foreach ($assembly in @($coreAssembly, $adapterAssembly)) {
            if (-not (Test-Path $assembly)) { throw "Test assembly is missing: $assembly" }
          }
          $coreOutput = Split-Path -Parent $coreAssembly
          if (Test-Path (Join-Path $coreOutput 'RecordSift.CsvHelperAdapter.dll')) {
            throw 'Domain tests must not copy or load vendor adapter assemblies.'
          }
          & $runner $coreAssembly '--result=TestResults/nunit-core.xml;format=nunit3' --noheader
          if ($LASTEXITCODE -ne 0) { throw "Core NUnit failed: $LASTEXITCODE" }
          & $runner $adapterAssembly '--result=TestResults/nunit-adapter.xml;format=nunit3' --noheader
          if ($LASTEXITCODE -ne 0) { throw "Adapter NUnit contract tests failed: $LASTEXITCODE" }
          [xml]$core = Get-Content TestResults/nunit-core.xml
          [xml]$adapter = Get-Content TestResults/nunit-adapter.xml
          $coreCount = [int]$core.'test-run'.total
          $adapterCount = [int]$adapter.'test-run'.total
          $failures = [int]$core.'test-run'.failed + [int]$adapter.'test-run'.failed
          if ($coreCount -lt 3 -or $adapterCount -lt 3 -or $failures -ne 0) {
            throw "Expected two independent passing NUnit suites; core=$coreCount adapter=$adapterCount failed=$failures."
          }
          Write-Host "Verified independent core NUnit=$coreCount adapter contract/component NUnit=$adapterCount total=$($coreCount + $adapterCount) failed=$failures."
      - name: Upload NUnit XML evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nunit-net48-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/nunit-*.xml
          if-no-files-found: warn
          retention-days: 14

  dependency-audit:
    name: Verify pinned packages and audit vulnerabilities
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Validate pinned dependency inventory and NuGet audit
        shell: pwsh
        run: |
          [xml]$config = Get-Content tests/RecordSift.Tests/packages.config -Raw
          $packages = @($config.packages.package)
          if ($packages.Count -ne 2) { throw "Unexpected test package count: $($packages.Count)" }
          $expected = @{ NUnit = '3.14.0'; 'NUnit.ConsoleRunner' = '3.17.0' }
          foreach ($package in $packages) {
            $id = [string]$package.id
            if (-not $expected.ContainsKey($id) -or $expected[$id] -ne [string]$package.version) {
              throw "Unexpected pinned dependency: $id $($package.version)"
            }
          }
          [xml]$adapterTests = Get-Content tests/RecordSift.CsvHelperAdapter.Tests/packages.config -Raw
          $adapterTestPackages = @($adapterTests.packages.package)
          if ($adapterTestPackages.Count -ne 1 -or
              [string]$adapterTestPackages[0].id -ne 'NUnit' -or
              [string]$adapterTestPackages[0].version -ne '3.14.0') {
            throw 'Unexpected adapter test dependency inventory.'
          }
          $coreTestsProject = Get-Content tests/RecordSift.Tests/RecordSift.Tests.csproj -Raw
          if ($coreTestsProject -match 'CsvHelper|RecordSift.CsvHelperAdapter') {
            throw 'Core unit-test project must not reference CSV parser or vendor adapters.'
          }
          $badCoreSource = @(Get-ChildItem tests/RecordSift.Tests -Recurse -Filter '*.cs' |
              Select-String -Pattern '^\s*using\s+(?:CsvHelper|RecordSift\.Adapters)\b')
          if ($badCoreSource.Count -gt 0) {
            throw 'Core unit-test source must not import parser vendor or adapter namespaces.'
          }
          [xml]$adapterConfig = Get-Content src/RecordSift.CsvHelperAdapter/packages.config -Raw
          $adapterPackages = @($adapterConfig.packages.package)
          $adapterExpected = @{
            CsvHelper = '33.1.0'
            'Microsoft.Bcl.AsyncInterfaces' = '8.0.0'
            'Microsoft.Bcl.HashCode' = '1.1.1'
            'Microsoft.CSharp' = '4.7.0'
            'System.Memory' = '4.5.5'
            'System.Buffers' = '4.5.1'
            'System.Numerics.Vectors' = '4.5.0'
            'System.Runtime.CompilerServices.Unsafe' = '6.0.0'
            'System.Threading.Tasks.Extensions' = '4.5.4'
          }
          if ($adapterPackages.Count -ne $adapterExpected.Count) {
            throw "Unexpected CSV adapter package count: $($adapterPackages.Count)"
          }
          foreach ($package in $adapterPackages) {
            $id = [string]$package.id
            if (-not $adapterExpected.ContainsKey($id) -or $adapterExpected[$id] -ne [string]$package.version) {
              throw "Unexpected CSV adapter dependency: $id $($package.version)"
            }
          }
          if ((Get-Content src/RecordSift/RecordSift.csproj -Raw) -match 'CsvHelper|\\.\\.\\RecordSift.CsvHelperAdapter') {
            throw "Domain core must not reference CSV parser vendor or adapter assemblies."
          }
          New-Item -ItemType Directory -Force -Path TestResults | Out-Null
          $lines = @(& nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config -Verbosity normal 2>&1)
          $exit = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host "$_" }
          $lines | Set-Content TestResults/nuget-audit.log
          if ($exit -ne 0) { throw "NuGet audit restore failed with exit code $exit" }
          $findings = @($lines | Where-Object { "$_" -match '\bNU190[0-5]\b' })
          if ($findings.Count -gt 0) { throw "NuGet audit reported $($findings.Count) warning(s), see nuget-audit.log" }
          Write-Host 'Expected packages pinned; NuGet audit reported no NU1900-NU1905 warnings.'
      - name: Upload NuGet audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nuget-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: TestResults/nuget-audit.log
          if-no-files-found: warn
          retention-days: 14
