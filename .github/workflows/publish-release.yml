name: Publish verified RecordSift package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'NuGet package version (release 0.1 automation currently supports 0.1.0)'
        required: true
        type: string

# Manual dispatch on main, followed by an owner-approved publishing environment.
# No publishing, tag creation or GitHub Release occurs during pull-request CI.
permissions:
  contents: read

concurrency:
  group: recordsift-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Validate main and build exact release artifact
    if: github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
    steps:
      - name: Check out the exact release source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Validate version, exact main commit, release identity and four CI gates
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_VERSION -cne '0.1.0') {
            throw 'This reviewed release pipeline supports only 0.1.0. Future versions require updating versioned assemblies, packaging and consumer acceptance first.'
          }
          $checkedOut = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -cne $env:GITHUB_SHA) { throw 'Checkout/source SHA mismatch.' }
          # Git ls-remote produces no output (PowerShell $null) when a ref is absent.
          # Capture lines as an array instead of calling .Trim() on the possibly empty result.
          $mainRefs = @(& git ls-remote origin refs/heads/main)
          if ($LASTEXITCODE -ne 0 -or $mainRefs.Count -ne 1) {
            throw 'Cannot determine the current main ref; publication halted.'
          }
          $remoteSha = ($mainRefs[0] -split '\s+')[0]
          if ($remoteSha -cne $env:GITHUB_SHA) {
            throw 'main moved since workflow dispatch; do not publish an unreviewed/stale source.'
          }
          $tag = "refs/tags/v$env:RELEASE_VERSION"
          $tagRefs = @(& git ls-remote origin $tag)
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify the release tag; publication halted.' }
          if ($tagRefs.Count -ne 0) { throw 'Release tag already exists; publication halted.' }
          $headers = @{
            Authorization = "Bearer $env:GH_READ_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/commits/$env:GITHUB_SHA/check-runs?per_page=100"
          $checks = Invoke-RestMethod -Uri $uri -Headers $headers -Method Get
          foreach ($name in @(
            'Windows restore, MSBuild and NUnit',
            'Verify pinned packages and audit vulnerabilities',
            'Standalone NuGet net48 consumer',
            'Requirement catalogs and internal links'
          )) {
            if (-not @($checks.check_runs | Where-Object {
              $_.name -ceq $name -and $_.status -ceq 'completed' -and $_.conclusion -ceq 'success'
            }).Count) { throw "Missing successful required check on exact main SHA: $name" }
          }
          Write-Host "PASS: $env:RELEASE_VERSION at $env:GITHUB_SHA on main; four CI gates successful."

      - name: Restore exact pinned packages
        shell: pwsh
        run: |
          nuget restore RecordSift.sln -NonInteractive -PackagesDirectory packages -ConfigFile NuGet.Config
          if ($LASTEXITCODE -ne 0) { throw 'NuGet restore failed.' }

      - name: Build .NET Framework 4.8 Release assemblies
        shell: pwsh
        run: |
          $vswhere = Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuild = & $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          if (-not $msbuild) { throw 'MSBuild not found.' }
          & $msbuild RecordSift.sln /m /t:Rebuild /p:Configuration=Release '/p:Platform=Any CPU' /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw 'Release MSBuild failed.' }

      - name: Build package and execute clean local-feed consumer
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $output = Join-Path $env:RUNNER_TEMP 'RecordSift-Publication'
          & .\scripts\build_release_candidate.ps1 -OutputDirectory $output -PackageVersion $env:RELEASE_VERSION
          & .\scripts\verify_clean_consumer.ps1 -CandidateDirectory $output -PackageVersion $env:RELEASE_VERSION
          $package = Join-Path $output "RecordSift.$env:RELEASE_VERSION.nupkg"
          if (-not (Test-Path -LiteralPath $package)) { throw 'Expected stable package missing.' }
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item -LiteralPath $package -Destination $dist
          $hash = (Get-FileHash -LiteralPath (Join-Path $dist "RecordSift.$env:RELEASE_VERSION.nupkg") -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  RecordSift.$env:RELEASE_VERSION.nupkg" | Set-Content -LiteralPath (Join-Path $dist 'SHA256SUMS.txt') -Encoding ascii
          "source_commit=$env:GITHUB_SHA" | Set-Content -LiteralPath (Join-Path $dist 'SOURCE_COMMIT.txt') -Encoding ascii
          Write-Host "Verified unpublished package SHA256=$hash; source=$env:GITHUB_SHA."

      - name: Preserve validated package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recordsift-publish-candidate-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  publish:
    name: Owner approval and NuGet Trusted Publishing
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: nuget-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the exact approved package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recordsift-publish-candidate-${{ github.run_id }}
          path: dist

      - name: Recheck package provenance and main source before publishing
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "0.1.0"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          tr -d '\r' < dist/SOURCE_COMMIT.txt | grep -Fxq "source_commit=$GITHUB_SHA"
          test -f "dist/RecordSift.$RELEASE_VERSION.nupkg"
          main_sha="$(git ls-remote https://github.com/infoconex/RecordSift.git refs/heads/main | cut -f1)"
          test "$main_sha" = "$GITHUB_SHA" || { echo 'main moved after preflight; publication halted.'; exit 1; }
          echo "Release package, source SHA and main HEAD verified after manual approval."

      - name: Authenticate with NuGet via GitHub OIDC (temporary key)
        id: nuget_login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: infoconex

      - name: Publish exact package to nuget.org
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NUGET_API_KEY: ${{ steps.nuget_login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "dist/RecordSift.$RELEASE_VERSION.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json
          echo "Uploaded RecordSift $RELEASE_VERSION to nuget.org; public-feed verification follows."

  verify_public:
    name: Verify published nuget.org package in isolated net48 consumer
    needs: publish
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Checkout the exact published source commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Independently install and run actual published package
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $checkedOut = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $checkedOut -cne $env:GITHUB_SHA) { throw 'Published source SHA mismatch.' }
          for ($attempt = 1; $attempt -le 6; $attempt++) {
            try {
              & .\scripts\verify_clean_consumer.ps1 -FromNuGetOrg -PackageVersion $env:RELEASE_VERSION -ExpectedSourceCommit $env:GITHUB_SHA
              if ($LASTEXITCODE -ne 0) { throw 'Public installed-consumer verification failed.' }
              Write-Host 'PASS: independent public NuGet package install and execution.'
              exit 0
            } catch {
              if ($attempt -ge 6) { throw }
              Write-Warning "Public-feed validation attempt $attempt failed: $($_.Exception.Message). Retrying."
              Start-Sleep -Seconds 60
            }
          }

  github_release:
    name: Create immutable GitHub tag and release after public verification
    needs: [prepare, verify_public]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout the exact published source commit
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download validated upload artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recordsift-publish-candidate-${{ github.run_id }}
          path: dist

      - name: Publish release with verified package and checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum --check SHA256SUMS.txt)
          tr -d '\r' < dist/SOURCE_COMMIT.txt | grep -Fxq "source_commit=$GITHUB_SHA"
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite." >&2
            exit 1
          fi
          if git ls-remote --tags https://github.com/infoconex/RecordSift.git "refs/tags/$tag" | grep -q .; then
            echo "Tag $tag already exists; refusing to retarget." >&2
            exit 1
          fi
          gh release create "$tag" "dist/RecordSift.$RELEASE_VERSION.nupkg" dist/SHA256SUMS.txt dist/SOURCE_COMMIT.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "RecordSift $RELEASE_VERSION" --notes-file docs/release/0.1-release-notes.md
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json url,tagName
