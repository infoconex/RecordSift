name: Temporary SDK pin and legacy MSBuild precedence probe
on:
  push:
    branches:
      - discovery/props-sdk-selection-20261102
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Compare SDK selection
        shell: pwsh
        run: |
          Write-Host "SELECT unpinned=$(dotnet --version)"
          '{"sdk":{"version":"10.0.403","rollForward":"disable"}}' | Set-Content global.json
          Write-Host "SELECT fixed=$(dotnet --version)"
          '{"sdk":{"version":"10.0.303","rollForward":"latestFeature"}}' | Set-Content global.json
          Write-Host "SELECT latestFeature=$(dotnet --version)"
          '{"sdk":{"version":"10.0.999","rollForward":"disable"}}' | Set-Content global.json
          cmd.exe /c "dotnet --version & exit /b 0"
          Write-Host 'SELECT deliberately missing SDK produced the expected diagnostic'
          Remove-Item global.json -Force
      - name: Compare shared default override behavior
        shell: pwsh
        run: |
          $proj='src/RecordSift.Domain/RecordSift.Domain.csproj'
          $vswhere=Join-Path ([Environment]::GetFolderPath('ProgramFilesX86')) 'Microsoft Visual Studio/Installer/vswhere.exe'
          $msbuild=& $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
          $source=Get-Content $proj -Raw
          Set-Content $proj -Value $source.Replace('<LangVersion>7.3</LangVersion>','<LangVersion>7.2</LangVersion>') -Encoding utf8
          '<Project><PropertyGroup><LangVersion>7.3</LangVersion></PropertyGroup></Project>' | Set-Content Directory.Build.props
          Write-Host 'PROPS unconditional:'; & $msbuild $proj '-getProperty:LangVersion'
          '<Project><PropertyGroup><LangVersion Condition="''$(LangVersion)'' == ''''">7.3</LangVersion></PropertyGroup></Project>' | Set-Content Directory.Build.props
          Write-Host 'PROPS conditional:'; & $msbuild $proj '-getProperty:LangVersion'
          Write-Host 'PROPS uncommitted state:'; git status --short
