# Read-only discovery evidence for baseline items 20-31.
# This workflow runs from draft research PR #273 and interrogates a Windows CI host,
# NOT the operator's local workstation. Application source stays at the frozen SHA.
name: Inventory Windows CI toolchain for technical discovery

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/validate-discovery-windows-inventory.yml'

permissions:
  contents: read

jobs:
  inventory:
    name: Read-only Windows CI host and tool inventory
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Checkout frozen RecordSift source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: 1809d06c0fade59e4769d16e0f8eaf10fa426004
          persist-credentials: false

      - name: Record host, runtimes, tools and reference assembly evidence
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceSha = '1809d06c0fade59e4769d16e0f8eaf10fa426004'
          $actualSha = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualSha -ne $sourceSha) {
            throw "Immutable checkout mismatch: expected $sourceSha, observed $actualSha"
          }

          # Query only installed tools and operating-system metadata; do not
          # restore packages, invoke MSBuild targets, build, run tests or publish.
          $os = Get-CimInstance Win32_OperatingSystem
          if (-not $os) { throw 'Unable to inspect Windows operating system.' }

          function Read-Tool {
            param([string]$Name, [string[]]$Arguments)
            $cmd = Get-Command $Name -ErrorAction SilentlyContinue
            if (-not $cmd) { return [ordered]@{ Found = $false; ExitCode = $null; Lines = @() } }
            $output = @(& $cmd.Source @Arguments 2>&1 | ForEach-Object { [string]$_ })
            $code = $LASTEXITCODE
            return [ordered]@{ Found = $true; ExitCode = $code; Lines = @($output) }
          }

          $git = Read-Tool git @('--version')
          $sdk = Read-Tool dotnet @('--list-sdks')
          $runtimes = Read-Tool dotnet @('--list-runtimes')
          $nuget = Read-Tool nuget @('help')

          $sdkRows = @(
            foreach ($line in $sdk.Lines) {
              if ($line -match '^(?<ver>\S+)\s+\[(?<path>[^\]]+)\]$') {
                [ordered]@{ Version = $Matches.ver; InstallationPath = $Matches.path }
              }
            }
          )
          $runtimeRows = @(
            foreach ($line in $runtimes.Lines) {
              if ($line -match '^(?<name>\S+)\s+(?<ver>\S+)\s+\[(?<path>[^\]]+)\]$') {
                [ordered]@{ RuntimeName = $Matches.name; Version = $Matches.ver; InstallationPath = $Matches.path }
              }
            }
          )

          $nugetVersion = $null
          foreach ($line in $nuget.Lines) {
            if ($line -match '(?i)NuGet Version:\s*(?<version>\S+)') {
              $nugetVersion = $Matches.version
              break
            }
          }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $msbuildPath = $null
          $msbuildVersion = $null
          if (Test-Path -LiteralPath $vswhere) {
            $found = @(& $vswhere -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe')
            if ($LASTEXITCODE -eq 0 -and $found.Count -gt 0) {
              $msbuildPath = [string]$found[0]
              $msbuildOutput = @(& $msbuildPath -version -nologo)
              if ($LASTEXITCODE -eq 0) { $msbuildVersion = ($msbuildOutput | Out-String).Trim() }
            }
          }

          $packLocations = @(
            if (${env:ProgramFiles(x86)}) {
              Join-Path ${env:ProgramFiles(x86)} 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
            }
            if ($env:ProgramFiles) {
              Join-Path $env:ProgramFiles 'Reference Assemblies\Microsoft\Framework\.NETFramework\v4.8'
            }
          ) | Select-Object -Unique
          $packChecks = @(
            foreach ($folder in $packLocations) {
              $file = Join-Path $folder 'mscorlib.dll'
              [ordered]@{ Framework = 'v4.8'; Location = $folder; ReferenceAssemblyFile = $file; Installed = (Test-Path -LiteralPath $file -PathType Leaf) }
            }
          )

          $report = [ordered]@{
            SourceCommit = $actualSha
            EvidenceEnvironment = 'GitHub Actions hosted Windows runner; not operator local'
            RunnerLabel = 'windows-2022'
            RunnerImage = $env:ImageOS
            RunnerImageVersion = $env:ImageVersion
            CollectedUTC = (Get-Date).ToUniversalTime().ToString('o')
            OperatingSystem = [ordered]@{
              Name = [string]$os.Caption
              Version = [string]$os.Version
              Build = [string]$os.BuildNumber
              Architecture = [string]$os.OSArchitecture
            }
            PowerShellVersion = $PSVersionTable.PSVersion.ToString()
            Git = [ordered]@{ Found = $git.Found; VersionOutput = @($git.Lines); ExitCode = $git.ExitCode }
            DotNetSDK = [ordered]@{ Found = $sdk.Found; ExitCode = $sdk.ExitCode; Inventory = $sdkRows; RawLines = @($sdk.Lines) }
            DotNetRuntimes = [ordered]@{ Found = $runtimes.Found; ExitCode = $runtimes.ExitCode; Inventory = $runtimeRows; RawLines = @($runtimes.Lines) }
            MSBuild = [ordered]@{ Version = $msbuildVersion; ExecutablePath = $msbuildPath }
            NuGetCLI = [ordered]@{ Found = $nuget.Found; Version = $nugetVersion; ExitCode = $nuget.ExitCode }
            FrameworkReferenceAssemblies = $packChecks
            Method = 'Read-only CIM, version/list and Test-Path queries; no restore, build or tests'
          }

          $outputPath = Join-Path $env:RUNNER_TEMP 'recordsift-windows-inventory-20-31.json'
          $report | ConvertTo-Json -Depth 8 | Set-Content -LiteralPath $outputPath -Encoding utf8
          Write-Host "Frozen source SHA: $actualSha"
          Write-Host "Runner image: $($report.RunnerImage) $($report.RunnerImageVersion)"
          Write-Host "OS: $($os.Caption) | $($os.Version) | $($os.BuildNumber) | $($os.OSArchitecture)"
          Write-Host "PowerShell: $($report.PowerShellVersion)"
          Write-Host "Git: $($git.Lines -join ' ')"
          Write-Host "SDKs: $(ConvertTo-Json -InputObject $sdkRows -Compress -Depth 3)"
          Write-Host "Runtimes: $(ConvertTo-Json -InputObject $runtimeRows -Compress -Depth 3)"
          Write-Host "MSBuild: $msbuildVersion | $msbuildPath"
          Write-Host "NuGet CLI: $nugetVersion (found=$($nuget.Found))"
          Write-Host "Framework v4.8 reference assembly checks: $(ConvertTo-Json -InputObject $packChecks -Compress -Depth 3)"
          Write-Host "Saved JSON evidence (read-only inventory): $outputPath"

      - name: Retain scoped evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recordsift-windows-inventory-20-31-${{ github.run_id }}
          path: ${{ runner.temp }}/recordsift-windows-inventory-20-31.json
          if-no-files-found: warn
